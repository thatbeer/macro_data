[project]
name = "macro-data"
version = "0.1.0"
description = "Local macro-economics data store: FX, commodities, indices, indicators"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebook = ["matplotlib>=3.8", "ipykernel>=6.29", "nbconvert>=7.16", "mplfinance>=0.12"]
bigquery = ["google-cloud-bigquery>=3.11", "pyarrow>=14.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["macro_data", "macro_data.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
