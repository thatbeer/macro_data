# Real BigQuery-backed variant of market_data_assets_smoke.yaml -- NOT runnable
# yet, since market_data.forecast_assets has no rows until a real ingestion
# pipeline exists (see project_design.md §9 / the market-data-schema spec's
# non-goals). Kept here so the mapping is ready the moment real data lands.
#
# Run from inside AIML-ML-Multi-Forecast-Engine (once market_data has data):
#   uv run horizons run --mode smoke --config ../Macro_data/forecasting/configs/market_data_assets_bigquery.yaml

mode: experiment

experiment_name: market_data_assets_bigquery
artifacts_dir: artifacts/market_data_assets_bigquery

dataset:
  target: value
  date: date
  freq: "D"
  keys:
    item: catalog_id
    location: domain_table

data_sources:
  modeling_base:
    type: bigquery
    project: your-gcp-project
    dataset: market_data
    table: forecast_assets

preprocessing:
  densify_grid: true
  detrend:
    mode: normal
    window: 28
  normalize:
    enabled: false
  postprocessing:
    clip_negative: true
    round_to_integer: false

features:
  calendar:
    enabled: true
  events:
    enabled: false
  hierarchical:
    enabled: false
  matrix_features:
    enabled: true
    lags:
      target: [1, 7, 14, 30]
    rolling_means: [7, 30]
    ewma_alphas: [0.1]
  cyclical:
    enabled: false
  volatility:
    enabled: false
  external: []

horizon:
  horizons: [1, 7, 30]
  unit: days
  architectures: [direct]

validation:
  strategy: expanding_window
  n_folds: 1
  window_size_days: 90
  test_days: 30
  runway_days: 30

tuning:
  enabled: false

models:
  selection_metric: mae
  lightgbm:
    enabled: true
    num_boost_round: 50
    early_stopping_rounds: 10
    base_params:
      boosting_type: gbdt
      learning_rate: 0.05
      random_state: 42
      verbose: -1
      n_jobs: -1
      feature_pre_filter: false
    variants:
      - name: lgb_l1
  xgboost:
    enabled: false
  baseline:
    enabled: false

output:
  predictions:
    type: parquet
    path: artifacts/market_data_assets_bigquery/predictions.parquet

interpretability:
  shap:
    enabled: false

memory:
  budget_gb: 8.0
  warn_at_fraction: 0.75
  abort_at_fraction: 0.90
  warn_only: true

cache:
  enabled: false
  post_horizon_path: null
  overwrite: false

smoke:
  sample_n_series: 15
  n_folds: 1
  n_trials: 1
  horizons: [1, 7, 30]
  architectures: [direct]
