# Series catalog: add an entry here to start collecting a new series.
# Keys other than id/source/name are passed to the source fetcher.
series:
  # --- Yahoo Finance (no key) ---
  - id: usd_thb
    source: yahoo
    ticker: "THB=X"
    name: "USD/THB exchange rate"
  - id: eur_usd
    source: yahoo
    ticker: "EURUSD=X"
    name: "EUR/USD exchange rate"
  - id: gold_usd
    source: yahoo
    ticker: "GC=F"
    name: "Gold futures (USD/oz)"
  - id: brent_oil
    source: yahoo
    ticker: "BZ=F"
    name: "Brent crude futures (USD/bbl)"
  - id: wti_oil
    source: yahoo
    ticker: "CL=F"
    name: "WTI crude futures (USD/bbl)"
  - id: silver_usd
    source: yahoo
    ticker: "SI=F"
    name: "Silver futures (USD/oz)"
  - id: copper_usd
    source: yahoo
    ticker: "HG=F"
    name: "Copper futures (USD/lb)"
  - id: natural_gas
    source: yahoo
    ticker: "NG=F"
    name: "Natural gas futures (USD/MMBtu)"
  - id: sp500
    source: yahoo
    ticker: "^GSPC"
    name: "S&P 500 index"
  - id: set_index
    source: yahoo
    ticker: "^SET.BK"
    name: "SET index (Thailand)"
  - id: usd_dxy
    source: yahoo
    ticker: "DX-Y.NYB"
    name: "US Dollar Index (ICE)"
  - id: eur_thb
    source: yahoo
    ticker: "EURTHB=X"
    name: "EUR/THB exchange rate"
  - id: jpy_thb
    source: yahoo
    ticker: "JPYTHB=X"
    name: "JPY/THB exchange rate"
  - id: gbp_thb
    source: yahoo
    ticker: "GBPTHB=X"
    name: "GBP/THB exchange rate"
  - id: us_3m_yield
    source: yahoo
    ticker: "^IRX"
    name: "US 13-week Treasury bill yield (%)"
  - id: us_5y_yield
    source: yahoo
    ticker: "^FVX"
    name: "US 5-year Treasury yield (%)"
  - id: us_10y_yield
    source: yahoo
    ticker: "^TNX"
    name: "US 10-year Treasury yield (%)"
  - id: us_30y_yield
    source: yahoo
    ticker: "^TYX"
    name: "US 30-year Treasury yield (%)"

  # --- World Bank (no key) ---
  - id: th_gdp_usd
    source: worldbank
    indicator: NY.GDP.MKTP.CD
    country: THA
    name: "Thailand GDP (current US$)"
  - id: th_inflation
    source: worldbank
    indicator: FP.CPI.TOTL.ZG
    country: THA
    name: "Thailand inflation, CPI (annual %)"
  - id: th_unemployment
    source: worldbank
    indicator: SL.UEM.TOTL.ZS
    country: THA
    name: "Thailand unemployment rate (% of labor force)"
  - id: th_gov_debt_gdp
    source: worldbank
    indicator: GC.DOD.TOTL.GD.ZS
    country: THA
    name: "Thailand central government debt (% of GDP)"
  - id: th_current_account_gdp
    source: worldbank
    indicator: BN.CAB.XOKA.GD.ZS
    country: THA
    name: "Thailand current account balance (% of GDP)"
  - id: us_gdp_usd
    source: worldbank
    indicator: NY.GDP.MKTP.CD
    country: USA
    name: "US GDP (current US$)"
  - id: us_inflation
    source: worldbank
    indicator: FP.CPI.TOTL.ZG
    country: USA
    name: "US inflation, CPI (annual %)"
  - id: us_unemployment
    source: worldbank
    indicator: SL.UEM.TOTL.ZS
    country: USA
    name: "US unemployment rate (% of labor force)"
  - id: us_gov_debt_gdp
    source: worldbank
    indicator: GC.DOD.TOTL.GD.ZS
    country: USA
    name: "US federal government debt (% of GDP)"
  - id: us_current_account_gdp
    source: worldbank
    indicator: BN.CAB.XOKA.GD.ZS
    country: USA
    name: "US current account balance (% of GDP)"

  # --- FRED (needs FRED_API_KEY) ---
  - id: us_cpi
    source: fred
    series: CPIAUCSL
    name: "US CPI (all urban consumers)"
  - id: fed_funds_rate
    source: fred
    series: FEDFUNDS
    name: "US federal funds effective rate"

  # --- Bank of Thailand (needs BOT_CLIENT_ID) ---
  - id: usd_thb_bot
    source: bot
    url: "https://apigw1.bot.or.th/bot/public/Stat-ExchangeRate/v2/DAILY_AVG_EXG_RATE/"
    value_field: mid_rate
    query:
      currency: USD
    name: "USD/THB daily average reference rate (BOT)"
